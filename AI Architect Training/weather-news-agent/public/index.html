<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weather &amp; News Agent</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --muted:#94a3b8; --txt:#e2e8f0; --accent:#14b8a6; --line:#334155; --user:#1d4ed8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--txt); display:flex; flex-direction:column; height:100vh; }
  header { padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  .pill { background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px 11px; font-size:12px; color:var(--muted); }
  main { flex:1; overflow-y:auto; padding:20px; max-width:780px; width:100%; margin:0 auto; }
  .msg { margin:10px 0; display:flex; }
  .msg .bubble { padding:11px 14px; border-radius:12px; white-space:pre-wrap; line-height:1.45; max-width:85%; }
  .msg.user { justify-content:flex-end; }
  .msg.user .bubble { background:var(--user); color:#fff; border-bottom-right-radius:3px; }
  .msg.bot .bubble { background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:3px; }
  .tools { font-size:11px; color:var(--muted); margin-top:6px; }
  .tool { display:inline-block; border:1px solid var(--line); border-radius:6px; padding:1px 6px; margin-right:4px; }
  .empty { color:var(--muted); text-align:center; margin-top:40px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:14px; }
  .chip { background:transparent; border:1px solid var(--line); color:var(--txt); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .chip:hover { border-color:var(--accent); }
  footer { border-top:1px solid var(--line); padding:14px 20px; }
  .composer { max-width:780px; margin:0 auto; display:flex; gap:10px; }
  input[type=text]{ flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:#0b1220; color:var(--txt); font:inherit; }
  button.send { background:var(--accent); color:#04211d; border:none; border-radius:10px; padding:0 20px; font-weight:600; cursor:pointer; }
  button.send:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <h1>🌤️📰 Weather &amp; News Agent</h1>
  <span class="pill" id="status">connecting…</span>
  <span class="pill" id="tools"></span>
</header>

<main id="log">
  <div class="empty" id="empty">
    Ask me about the <b>current weather</b> or the <b>latest news</b>.
    <div class="chips">
      <button class="chip" onclick="demo(this)">What's the weather in Tokyo?</button>
      <button class="chip" onclick="demo(this)">Latest technology news</button>
      <button class="chip" onclick="demo(this)">Weather in London and the latest tech news</button>
      <button class="chip" onclick="demo(this)">Write me a poem about my cat</button>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <input id="q" type="text" placeholder="Ask about weather or news…" autocomplete="off"
      onkeydown="if(event.key==='Enter')send()" />
    <button class="send" id="send" onclick="send()">Send</button>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);

async function boot() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("status").textContent = `provider: ${h.provider}${h.offline ? " · offline" : " · live"}`;
    $("tools").textContent = "MCP tools: " + h.tools.join(", ");
  } catch { $("status").textContent = "offline"; }
}
function demo(btn){ $("q").value = btn.textContent; send(); }

function addMsg(role, text, tools) {
  $("empty")?.remove();
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  if (tools && tools.length) {
    const t = document.createElement("div"); t.className = "tools";
    t.innerHTML = "🔧 " + tools.map(x => `<span class="tool">${x}</span>`).join("");
    bubble.appendChild(t);
  }
  wrap.appendChild(bubble);
  $("log").appendChild(wrap);
  $("log").scrollTop = $("log").scrollHeight;
  return bubble;
}

async function send() {
  const q = $("q").value.trim(); if (!q) return;
  $("q").value = ""; $("send").disabled = true;
  addMsg("user", q);
  const thinking = addMsg("bot", "…thinking");
  try {
    const r = await (await fetch("/api/ask", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ question: q }),
    })).json();
    thinking.textContent = r.answer || "(no answer)";
    if (r.toolsUsed?.length) {
      const t = document.createElement("div"); t.className = "tools";
      t.innerHTML = "🔧 " + r.toolsUsed.map(x => `<span class="tool">${x}</span>`).join("");
      thinking.appendChild(t);
    }
  } catch (e) {
    thinking.textContent = "Error: " + e.message;
  } finally {
    $("send").disabled = false; $("q").focus();
  }
}
boot();
</script>
</body>
</html>
