<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ATP Match Assistant</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --muted:#94a3b8; --txt:#e2e8f0; --accent:#22c55e; --line:#334155; --user:#1d4ed8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--txt); display:flex; flex-direction:column; height:100vh; }
  header { padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  .pill { background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px 11px; font-size:12px; color:var(--muted); }
  main { flex:1; overflow-y:auto; padding:20px; max-width:820px; width:100%; margin:0 auto; }
  .msg { margin:10px 0; display:flex; }
  .msg.user { justify-content:flex-end; }
  .bubble { padding:11px 14px; border-radius:12px; white-space:pre-wrap; line-height:1.5; max-width:88%; }
  .user .bubble { background:var(--user); color:#fff; border-bottom-right-radius:3px; }
  .bot .bubble { background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:3px; }
  .meta { font-size:11px; color:var(--muted); margin-top:8px; }
  .tag { display:inline-block; border:1px solid var(--line); border-radius:6px; padding:1px 6px; margin:2px 4px 0 0; }
  .cite { color:var(--accent); }
  .empty { color:var(--muted); text-align:center; margin-top:36px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:14px; }
  .chip { background:transparent; border:1px solid var(--line); color:var(--txt); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .chip:hover { border-color:var(--accent); }
  footer { border-top:1px solid var(--line); padding:14px 20px; }
  .composer { max-width:820px; margin:0 auto; display:flex; gap:10px; }
  input[type=text]{ flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:#0b1220; color:var(--txt); font:inherit; }
  button.send { background:var(--accent); color:#052e16; border:none; border-radius:10px; padding:0 20px; font-weight:600; cursor:pointer; }
  button.send:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <h1>🎾 ATP Match Assistant</h1>
  <span class="pill" id="status">connecting…</span>
  <span class="pill" id="tools"></span>
  <label class="pill" style="margin-left:auto">sign in as
    <select id="role" style="background:transparent;color:inherit;border:none;font:inherit">
      <option value="player-token">player (public)</option>
      <option value="official-token">official</option>
      <option value="admin-token">admin</option>
    </select>
  </label>
</header>

<main id="log">
  <div class="empty" id="empty">
    Ask about <b>match data</b>, <b>weather</b> at a venue, <b>tennis news</b>, or <b>on-court rules</b>.
    <div class="chips">
      <button class="chip" onclick="demo(this)">Head-to-head Nadal vs Djokovic</button>
      <button class="chip" onclick="demo(this)">Roger Federer's record and titles</button>
      <button class="chip" onclick="demo(this)">Can I challenge a line call on clay?</button>
      <button class="chip" onclick="demo(this)">Weather in Paris and latest tennis news</button>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <input id="q" type="text" placeholder="Ask the assistant…" autocomplete="off" onkeydown="if(event.key==='Enter')send()" />
    <button class="send" id="send" onclick="send()">Send</button>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
async function api(path, body) {
  const headers = { "content-type": "application/json" };
  const token = $("role")?.value;
  if (token) headers["authorization"] = "Bearer " + token;
  const r = await fetch(path, { method: body ? "POST" : "GET", headers, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) return { answer: "Unauthorized — pick a valid role.", toolsUsed: [], citations: [] };
  return r.json();
}
async function boot() {
  try { const h = await api("/api/health");
    $("status").textContent = `provider: ${h.provider}${h.offline ? " · offline" : " · live"}`;
    $("tools").textContent = "tools: " + h.tools.join(", ");
  } catch { $("status").textContent = "offline"; }
}
function demo(btn){ $("q").value = btn.textContent; send(); }
function add(role, text) {
  $("empty")?.remove();
  const w = document.createElement("div"); w.className = "msg " + role;
  const b = document.createElement("div"); b.className = "bubble"; b.textContent = text;
  w.appendChild(b); $("log").appendChild(w); $("log").scrollTop = $("log").scrollHeight;
  return b;
}
const history = [];  // conversation memory: {role, content} per turn
async function send() {
  const q = $("q").value.trim(); if (!q) return;
  $("q").value = ""; $("send").disabled = true;
  add("user", q);
  const bubble = add("bot", "…thinking");
  try {
    const r = await api("/api/ask", { question: q, history });
    bubble.textContent = r.answer || "(no answer)";
    const meta = document.createElement("div"); meta.className = "meta";
    const tools = (r.toolsUsed||[]).map(t => `<span class="tag">🔧 ${t}</span>`).join("");
    const cites = (r.citations||[]).map(c => `<span class="tag cite">📎 ${c}</span>`).join("");
    meta.innerHTML = tools + cites;
    if (tools || cites) bubble.appendChild(meta);
    // remember this turn so follow-ups ("yes", "go on") keep context
    history.push({ role: "user", content: q }, { role: "assistant", content: r.answer || "" });
    if (history.length > 20) history.splice(0, history.length - 20);
  } catch (e) { bubble.textContent = "Error: " + e.message; }
  finally { $("send").disabled = false; $("q").focus(); }
}
boot();
</script>
</body>
</html>
