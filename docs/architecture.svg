<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 884" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <style>
      .lbl{fill:#0f172a;font-weight:700}
      .sub{fill:#475569;font-size:10.5px}
      .tech{fill:#64748b;font-size:10px;font-style:italic}
      .rel{fill:#475569;font-size:10px}
      .sec{fill:#b91c1c;font-size:10px}
      .edge{stroke:#94a3b8;stroke-width:1.5;fill:none;marker-end:url(#ah)}
    </style>
  </defs>

  <rect x="0" y="0" width="1320" height="884" fill="#f8fafc"/>
  <text x="24" y="30" font-size="18" class="lbl">ATP Match Assistant — C4 Container View (with security &amp; governance)</text>
  <text x="24" y="49" class="sub">All-TypeScript · Vercel AI SDK · MCP (stdio) · Arquero · Fastify · Azure / OpenAI-compatible + offline-mock</text>

  <!-- legend -->
  <g transform="translate(1000,30)">
    <rect x="0" y="0" width="13" height="11" rx="2" fill="#bfdbfe" stroke="#2563eb"/><text x="18" y="9" class="sub">app container</text>
    <rect x="120" y="0" width="13" height="11" rx="2" fill="#e0f2fe" stroke="#0ea5e9"/><text x="138" y="9" class="sub">MCP server</text>
    <rect x="0" y="18" width="13" height="11" rx="2" fill="#fef9c3" stroke="#eab308"/><text x="18" y="27" class="sub">data store</text>
    <rect x="120" y="18" width="13" height="11" rx="2" fill="#ede9fe" stroke="#8b5cf6"/><text x="138" y="27" class="sub">external system</text>
  </g>

  <!-- Person -->
  <rect x="70" y="62" width="230" height="54" rx="10" fill="#1e293b"/>
  <text x="185" y="86" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Player / Coach</text>
  <text x="185" y="103" text-anchor="middle" fill="#cbd5e1" font-size="10">[person]</text>

  <!-- boundary -->
  <rect x="40" y="132" width="700" height="700" rx="14" fill="none" stroke="#3b82f6" stroke-dasharray="6 5"/>
  <text x="56" y="153" fill="#2563eb" font-size="12" font-weight="700">System boundary — ATP Match Assistant</text>

  <!-- security pipeline band -->
  <rect x="60" y="166" width="660" height="46" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="70" y="184" class="lbl" font-size="11" fill="#991b1b">Request pipeline (cross-cutting controls)</text>
  <text x="70" y="200" class="sec" font-size="9.5">CORS · rate-limit · Bearer auth · input guardrail  →  agent (bounded steps/tokens)  →  structured output  →  output redaction  →  audit</text>

  <!-- Web UI -->
  <rect x="70" y="238" width="230" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="185" y="263" text-anchor="middle" class="lbl" font-size="13">Web UI</text>
  <text x="185" y="281" text-anchor="middle" class="sub">chat page · session history · role sign-in</text>

  <!-- API + Agent -->
  <rect x="70" y="338" width="230" height="126" rx="10" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="185" y="362" text-anchor="middle" class="lbl" font-size="13">API + Agent</text>
  <text x="185" y="379" text-anchor="middle" class="tech">Node · Fastify · Vercel AI SDK</text>
  <text x="185" y="396" text-anchor="middle" class="sub">routes to tools · rolling memory</text>
  <text x="185" y="412" text-anchor="middle" class="sub">in-process RAG (ACL) · guardrails</text>
  <text x="185" y="428" text-anchor="middle" class="sub">structured output + enforced cites</text>

  <!-- MCP servers -->
  <rect x="410" y="486" width="300" height="82" rx="10" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="560" y="512" text-anchor="middle" class="lbl" font-size="12.5">ATP Data MCP Server</text>
  <text x="560" y="528" text-anchor="middle" class="tech">MCP stdio · Arquero</text>
  <text x="560" y="546" text-anchor="middle" class="sub">query_matches · head_to_head · player_summary</text>

  <rect x="410" y="600" width="300" height="78" rx="10" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="560" y="627" text-anchor="middle" class="lbl" font-size="12.5">Weather MCP Server</text>
  <text x="560" y="645" text-anchor="middle" class="sub">get_weather · MCP stdio</text>

  <rect x="410" y="700" width="300" height="62" rx="10" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="560" y="726" text-anchor="middle" class="lbl" font-size="12.5">News MCP Server</text>
  <text x="560" y="743" text-anchor="middle" class="sub">get_news · MCP stdio</text>

  <!-- col3 -->
  <text x="950" y="153" fill="#475569" font-size="12" font-weight="700">External systems &amp; data</text>

  <rect x="800" y="300" width="300" height="46" rx="10" fill="#fef9c3" stroke="#eab308"/>
  <text x="950" y="328" text-anchor="middle" class="lbl" font-size="12">embedding index <tspan class="sub">[data]</tspan></text>

  <rect x="800" y="240" width="300" height="56" rx="10" fill="#fef9c3" stroke="#eab308"/>
  <text x="950" y="263" text-anchor="middle" class="lbl" font-size="12">case notes (.md)</text>
  <text x="950" y="281" text-anchor="middle" class="sub">role-tagged for ACL [data]</text>

  <rect x="800" y="360" width="320" height="84" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="960" y="388" text-anchor="middle" class="lbl" font-size="13">Azure OpenAI / OpenAI-compatible</text>
  <text x="960" y="406" text-anchor="middle" class="tech">[external]</text>
  <text x="960" y="424" text-anchor="middle" class="sub">LLM (orchestration) + embeddings</text>

  <rect x="800" y="486" width="300" height="82" rx="10" fill="#fef9c3" stroke="#eab308"/>
  <text x="950" y="514" text-anchor="middle" class="lbl" font-size="12.5">atp_matches.csv</text>
  <text x="950" y="532" text-anchor="middle" class="sub">match results (sample / Kaggle) [data]</text>

  <rect x="800" y="600" width="300" height="78" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="950" y="628" text-anchor="middle" class="lbl" font-size="13">Open-Meteo API</text>
  <text x="950" y="646" text-anchor="middle" class="sub">geocode + current weather (no key)</text>

  <rect x="800" y="700" width="300" height="62" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="950" y="726" text-anchor="middle" class="lbl" font-size="13">Google News RSS</text>
  <text x="950" y="744" text-anchor="middle" class="sub">tennis headlines (no key)</text>

  <!-- audit + observability -->
  <rect x="800" y="778" width="150" height="56" rx="10" fill="#fef9c3" stroke="#eab308"/>
  <text x="875" y="800" text-anchor="middle" class="lbl" font-size="11.5">Audit log</text>
  <text x="875" y="817" text-anchor="middle" class="sub">stdout JSON</text>
  <text x="875" y="830" text-anchor="middle" class="sub">(hash, no PII)</text>

  <rect x="968" y="778" width="220" height="56" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-dasharray="5 4"/>
  <text x="1078" y="800" text-anchor="middle" class="lbl" font-size="12">Observability sink</text>
  <text x="1078" y="817" text-anchor="middle" class="sub">Langfuse / OpenTelemetry</text>
  <text x="1078" y="830" text-anchor="middle" class="sub">optional · external</text>

  <!-- ===== edges ===== -->
  <path class="edge" d="M185,116 L185,238"/><text x="193" y="160" class="rel">HTTPS</text>
  <path class="edge" d="M185,298 L185,338"/><text x="193" y="322" class="rel">POST /api/ask + Bearer</text>

  <!-- API -> bus -->
  <path class="edge" d="M300,400 L360,400"/>
  <path class="edge" d="M360,400 L360,268"/>
  <path class="edge" d="M360,400 L360,805"/>

  <path class="edge" d="M360,268 L800,268"/><text x="430" y="261" class="rel">ACL-filtered read + embed</text>
  <path class="edge" d="M360,323 L800,323"/><text x="430" y="316" class="rel">build / search index</text>
  <path class="edge" d="M360,402 L800,402"/><text x="430" y="395" class="rel">chat + embeddings · structured output</text>
  <path class="edge" d="M360,527 L410,527"/><text x="160" y="500" class="sec">stdio/MCP · output wrapped &lt;untrusted_data&gt;</text>
  <path class="edge" d="M360,639 L410,639"/>
  <path class="edge" d="M360,731 L410,731"/>
  <path class="edge" d="M360,805 L800,805"/><text x="430" y="798" class="rel">audit record (hash, no PII)</text>

  <path class="edge" d="M710,527 L800,527"/><text x="724" y="521" class="rel">reads</text>
  <path class="edge" d="M710,639 L800,639"/><text x="724" y="633" class="rel">HTTPS</text>
  <path class="edge" d="M710,731 L800,731"/><text x="724" y="725" class="rel">RSS</text>
  <path class="edge" d="M950,805 L968,805"/><text x="900" y="772" class="rel">OBSERVABILITY=1</text>

  <!-- footer: 5 hardening controls -->
  <text x="40" y="868" class="sub"><tspan fill="#991b1b" font-weight="700">Security &amp; governance:</tspan>  1) untrusted-data delimiting (LLM01)  ·  2) Bearer auth + ACL retrieval  ·  3) rate-limit + step/token budget + CORS  ·  4) structured output + enforced citations  ·  5) guardrails + audit + observability</text>
</svg>
